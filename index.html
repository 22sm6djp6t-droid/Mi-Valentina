<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Valentina ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>

<div class="intro">

    <p id="text1">
        En un universo lleno de estrellas...
    </p>

    <p id="text2">
        encontré una que hizo brillar mi mundo.
    </p>

</div>


<section class="heart-section">

 <div class="particle-heart" id="particleHeart"></div>


    <h1>
        Mi Valentina
    </h1>


    <p class="date">
        Desde el 16 de mayo de 2022 ✨
    </p>


</section>


<!-- GALERÍA DE RECUERDOS -->

<section class="gallery-section">

    <h2>
        Nuestros recuerdos ✨
    </h2>


    <div class="gallery" id="gallery">

    </div>


</section>
    <!-- CARTA DE AMOR -->

<section class="letter-section">


    <div class="letter">


        <h2>
            Para Mi Valentina ❤️
        </h2>


        <p id="letterText"></p>


    </div>


</section>
    <!-- CONTADOR DE TIEMPO -->

<section class="time-section">


    <h2>
        Nuestro tiempo juntos ❤️
    </h2>


    <div class="counter">


        <div>
            <span id="years">0</span>
            <small>Años</small>
        </div>


        <div>
            <span id="months">0</span>
            <small>Meses</small>
        </div>


        <div>
            <span id="days">0</span>
            <small>Días</small>
        </div>


        <div>
            <span id="hours">0</span>
            <small>Horas</small>
        </div>


        <div>
            <span id="minutes">0</span>
            <small>Minutos</small>
        </div>


        <div>
            <span id="seconds">0</span>
            <small>Segundos</small>
        </div>


    </div>


</section>
<script src="script.js"></script>

</body>
</html>
